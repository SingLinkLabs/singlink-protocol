name: Repair public commit metadata

on:
  workflow_dispatch:
    inputs:
      reviewed_tip:
        description: Exact main commit reviewed for this one-time repair
        required: true
        type: string
      reviewed_repaired_tip:
        description: Exact neutral repair commit reviewed before dispatch
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: protocol-metadata-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'SingLinkLabs/singlink-protocol' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Replace only the two reviewed commits
        shell: bash
        env:
          REVIEWED_TIP: ${{ inputs.reviewed_tip }}
          REVIEWED_REPAIRED_TIP: ${{ inputs.reviewed_repaired_tip }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          old_tip = '07098999033593e466c3896edb11e6283368e1ee'
          base = '714dca4c8b3a176501f8aadc4727823747728a97'
          expected_tip = '2d5bf35145d9a03e3db062b609fb5a5785431d91'
          expected_tree = '3962050f808ad578f6d5aa0fbe80e48c6254a395'
          workflow_path = '.github/workflows/privacy-metadata-repair.yml'
          reviewed_tip = os.environ['REVIEWED_TIP']
          reviewed_repaired_tip = os.environ['REVIEWED_REPAIRED_TIP']
          reviewed = [
              ('67b704d505a162067ac48d3439945ab4709182d7',
               'cc47524f3bd799e80a3f9697bd805f0aa92a2030',
               '95f6303806b6aea546e261bdbd688f01b23e01d9'),
              (old_tip, expected_tip, expected_tree),
          ]

          def git(*args, **kwargs):
              return subprocess.check_output(['git', *args], **kwargs)

          def remote_tip():
              rows = git('ls-remote', '--heads', 'origin', 'refs/heads/main').decode().split()
              assert len(rows) == 2 and rows[1] == 'refs/heads/main', 'Unexpected main reference'
              return rows[0]

          assert re.fullmatch('[0-9a-f]{40}', reviewed_tip), 'A full reviewed commit is required'
          assert re.fullmatch('[0-9a-f]{40}', reviewed_repaired_tip), 'A full reviewed repaired commit is required'
          assert os.environ['WORKFLOW_SHA'] == reviewed_tip, 'Workflow event does not match the reviewed commit'
          assert remote_tip() == reviewed_tip, 'Main changed; refusing to replace any newer commits'
          assert git('rev-parse', 'HEAD').decode().strip() == reviewed_tip, 'Unexpected checkout'
          assert git('show', '-s', '--format=%P', reviewed_tip).decode().strip() == old_tip, 'Only the reviewed workflow commit may follow the original tip'
          paths = git('diff-tree', '--no-commit-id', '--name-only', '-r', old_tip, reviewed_tip).decode().splitlines()
          assert paths == [workflow_path], 'Unexpected files changed in the workflow commit'
          parent = base
          brand = 'SingLinkLabs'
          public_noreply = str(227677126) + '+' + brand + '@users.noreply.github.com'
          for old, expected, tree in reviewed:
              actual_tree = git('show', '-s', '--format=%T', old).strip()
              author_date, committer_date = git('show', '-s', '--format=%aI%x00%cI', old).strip().split(b'\0')
              message = git('cat-file', 'commit', old).split(b'\n\n', 1)[1]
              assert actual_tree.decode().strip() == tree, 'Reviewed tree mismatch'
              expected_old_parent = base if old == reviewed[0][0] else reviewed[0][0]
              assert git('show', '-s', '--format=%P', old).decode().strip() == expected_old_parent, 'Unexpected original parent'
              env = os.environ.copy()
              env.update({
                  'GIT_AUTHOR_NAME': brand,
                  'GIT_AUTHOR_EMAIL': public_noreply,
                  'GIT_COMMITTER_NAME': brand,
                  'GIT_COMMITTER_EMAIL': public_noreply,
                  'GIT_AUTHOR_DATE': author_date.decode().strip(),
                  'GIT_COMMITTER_DATE': committer_date.decode().strip(),
              })
              new = git('commit-tree', tree, '-p', parent, env=env, input=message).decode().strip()
              assert new == expected, 'Rebuilt commit differs from the reviewed candidate'
              assert git('cat-file', 'commit', new).split(b'\n\n', 1)[1] == message, 'Commit message changed'
              assert git('diff-tree', '--no-commit-id', '--name-only', '-r', old, new) == b'', 'File content changed'
              parent = new

          assert parent == expected_tip, 'Unexpected repaired tip'
          workflow_tree = git('show', '-s', '--format=%T', reviewed_tip).decode().strip()
          author_date, committer_date = git('show', '-s', '--format=%aI%x00%cI', reviewed_tip).strip().split(b'\0')
          env.update({
              'GIT_AUTHOR_DATE': author_date.decode().strip(),
              'GIT_COMMITTER_DATE': committer_date.decode().strip(),
          })
          neutral_message = b'Preserve temporary metadata repair workflow\n'
          repair_tip = git('commit-tree', workflow_tree, '-p', expected_tip, env=env, input=neutral_message).decode().strip()
          assert repair_tip == reviewed_repaired_tip, 'Neutral commit differs from the reviewed candidate'
          assert git('show', '-s', '--format=%T', repair_tip).decode().strip() == workflow_tree, 'Workflow file changed'
          assert git('cat-file', 'commit', repair_tip).split(b'\n\n', 1)[1] == neutral_message, 'Unexpected neutral commit message'
          assert remote_tip() == reviewed_tip, 'Main changed during preparation'
          subprocess.run([
              'git', 'push',
              '--force-with-lease=refs/heads/main:' + reviewed_tip,
              'origin', repair_tip + ':refs/heads/main',
          ], check=True)
          assert remote_tip() == repair_tip, 'Remote repair verification failed'
          print('Metadata repair verified. All reviewed file trees are unchanged.')
          PY
